<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홍길동 - 포트폴리오</title>
    
    <!-- 애플 스타일의 깔끔한 한글/영문 렌더링을 위한 프리텐다드 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    
    <!-- Tailwind CSS (단일 파일에서 빠르고 확실한 스타일링을 위해 CDN 사용) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        apple: {
                            black: '#1D1D1F',  /* 기본 텍스트 */
                            blue: '#0071E3',   /* 버튼/강조색 */
                            light: '#F5F5F7',  /* 밝은 섹션 배경 */
                            dark: '#000000',   /* 어두운 섹션 배경 */
                            white: '#FFFFFF'   /* 기본 배경 */
                        }
                    },
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* 폰트 굵기 위계 설정 */
        .text-title { font-weight: 700; letter-spacing: -0.02em; }
        .text-body { font-weight: 300; letter-spacing: -0.01em; line-height: 1.6; }
        
        /* 버튼 공통 스타일 (완전히 둥근 알약 모양) */
        .btn {
            border-radius: 9999px;
            padding: 0.75rem 1.5rem;
            font-size: 1.125rem;
            font-weight: 400;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }
        /* 채워진 버튼 */
        .btn-solid {
            background-color: #0071E3;
            color: #FFFFFF;
        }
        .btn-solid:hover {
            opacity: 0.9;
        }
        /* 테두리 버튼 */
        .btn-outline {
            background-color: transparent;
            border: 1px solid #0071E3;
            color: #0071E3;
        }
        .btn-outline:hover {
            background-color: rgba(0, 113, 227, 0.05);
        }
        
        /* 내비게이션바 애플 스타일 블러 처리 */
        .nav-blur {
            background-color: rgba(255, 255, 255, 0.72);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
        }
    </style>
</head>
<body class="bg-apple-white text-apple-black font-sans antialiased selection:bg-apple-blue selection:text-white">

    <!-- 1. 고정 내비게이션바 -->
    <nav class="fixed top-0 left-0 right-0 z-50 nav-blur">
        <div class="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between">
            <a href="#" class="text-title text-xl text-apple-black hover:opacity-70 transition-opacity">
                홍길동
            </a>
            <div class="hidden sm:flex space-x-8 text-sm text-body font-normal text-apple-black">
                <a href="#hero" class="hover:text-apple-blue transition-colors">소개</a>
                <a href="#vision" class="hover:text-apple-blue transition-colors">비전</a>
            </div>
        </div>
    </nav>

    <!-- 2. 히어로 섹션 -->
    <section id="hero" class="pt-40 pb-32 flex flex-col items-center justify-center text-center px-6">
        
        <!-- [사용자 수정 필요] 첨부해주신 이미지의 경로를 src에 넣어주세요 -->
        <img 
            src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" 
            alt="홍길동 프로필 이미지" 
            class="w-56 h-56 md:w-72 md:h-72 object-cover rounded-[2rem] shadow-sm mb-12"
        >
        
        <h1 class="text-title text-5xl md:text-7xl mb-6 text-apple-black">
            홍길동
        </h1>
        <p class="text-body text-2xl md:text-3xl max-w-2xl mx-auto text-apple-black mb-12">
            세상을 바꿀 알고리즘을 상상하는 예비 과학자입니다.
        </p>
        
        <!-- 버튼 짝 배치 (채워진 버튼 + 테두리 버튼) -->
        <div class="flex flex-col sm:flex-row gap-4">
            <a href="#vision" class="btn btn-solid">진로 알아보기</a>
            <button class="btn btn-outline" onclick="alert('포트폴리오 다운로드가 시작됩니다.')">포트폴리오 다운로드</button>
        </div>
    </section>

    <!-- 3. 2단 카드 그리드 섹션 -->
    <section id="vision" class="px-6 md:px-10 max-w-[1400px] mx-auto pb-40">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-full">
            
            <!-- 왼쪽: 내가 관심 있는 과학 진로 (밝은 배경) -->
            <div class="bg-apple-light rounded-[2.5rem] p-12 md:p-20 flex flex-col items-center text-center">
                <h2 class="text-title text-4xl md:text-5xl mb-6 text-apple-black">
                    내가 관심 있는<br>과학 진로
                </h2>
                <p class="text-body text-xl md:text-2xl text-apple-black mb-16 flex-grow">
                    인공지능 연구원.<br>
                    데이터를 바탕으로 스스로 학습하고<br>
                    사람들에게 꼭 필요한 서비스를 제공하는<br>
                    따뜻한 인공지능을 개발하고 싶습니다.
                </p>
                
                <!-- 버튼 짝 배치 -->
                <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
                    <button class="btn btn-solid w-full sm:w-auto">관련 활동 보기</button>
                    <button class="btn btn-outline w-full sm:w-auto">탐구 보고서</button>
                </div>
            </div>

            <!-- 오른쪽: 이 진로가 풀 미래 문제 (어두운 배경) -->
            <div class="bg-apple-dark rounded-[2.5rem] p-12 md:p-20 flex flex-col items-center text-center">
                <h2 class="text-title text-4xl md:text-5xl mb-6 text-apple-white">
                    이 진로가 풀<br>미래 문제
                </h2>
                <p class="text-body text-xl md:text-2xl text-apple-white mb-16 flex-grow">
                    지구 온난화와 자원 부족.<br>
                    인공지능 기술을 통해 에너지를<br>
                    효율적으로 관리하고 낭비를 줄여<br>
                    지구를 보호하는 데 기여할 것입니다.
                </p>
                
                <!-- 버튼 짝 배치 -->
                <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
                    <button class="btn btn-solid w-full sm:w-auto">해결 아이디어</button>
                    <button class="btn btn-outline w-full sm:w-auto" style="border-color: #0071E3; color: #0071E3;">토론 기록</button>
                </div>
            </div>

        </div>
    </section>

    <!-- 4. 푸터 -->
    <footer class="py-12 border-t border-apple-light">
        <div class="max-w-7xl mx-auto px-6 text-center text-body text-sm text-apple-black opacity-60">
            <p>홍길동</p>
            <p class="mt-1">2026. 09. 04</p>
        </div>
    </footer>

</body>
</html>
